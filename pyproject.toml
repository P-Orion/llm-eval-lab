[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="llm-eval-lab"
version="0.1.0"
description="Eval Lab: independent, reproducible ML engineering"
requires-python=">=3.11,<3.13"
authors=[{name="Orion Powers"}]
dependencies=["numpy==2.4.6","fastapi==0.142.2","uvicorn==0.54.0","python-multipart==0.0.32","joblib==1.6.0"]
[project.optional-dependencies]
dev=["pytest==9.1.1","httpx==0.28.1","ruff==0.16.10"]
viz=["matplotlib==3.11.2"]
[project.scripts]
llm-eval-lab="llm_eval_lab.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
markers=["ocr: actual pretrained OCR integration"]
